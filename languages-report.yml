# Languages report
# --------------------
# language_server:     language server for Neovim, as named in Mason or its own toolchain
# formatter:           tool that formats files, usable from conform.nvim or the editor
# syntax_highlighting: tree-sitter parser from nvim-treesitter, else built-in Neovim vim syntax
# "none" means no option was found.
# [installed] means it is on this machine now: in Mason, in the PATH, or shipped with Neovim.
# tree-sitter parsers are marked [not installed] when nvim-treesitter has one but it is not compiled yet.

"Build tools":
  - "CMake": { language_server: "neocmakelsp", formatter: "gersemi", syntax_highlighting: "tree-sitter (cmake) [not installed]" }
  - "Dockerfile": { language_server: "dockerfile-language-server", formatter: "dockerfmt", syntax_highlighting: "tree-sitter (dockerfile) [not installed]" }

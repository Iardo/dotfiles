# Seek
# --------------------
RIGHT seek  15 exact
LEFT  seek -15 exact
Shift+Alt+RIGHT frame-step
Shift+Alt+LEFT  frame-back-step
Shift+RIGHT seek  5 exact
Shift+LEFT  seek -5 exact
. frame-step
, frame-back-step

# Video
# --------------------
r cycle_values video-rotate 90 180 270 0

# Volume
# --------------------
UP add volume 5
DOWN add volume -5

# Playlist
# --------------------
PGUP script-binding playlist-hold/prev
PGDWN script-binding playlist-hold/next

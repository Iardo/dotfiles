# Languages selection
# --------------------
# Set each entry to true to install and enable it, or false to leave it out.
# tree-sitter parsers start as true. Language servers and formatters start as false,
# except the ones already installed with Mason, which start as true.
# "# installed" means it is already on this machine. "# mason" can be installed from Mason,
# "# manual install" comes with the language toolchain or has to be installed by hand.
# vim syntax entries are built into Neovim, so they need nothing.
# When a language has several options, each one says what sets it apart and one is marked ★ recomendado.

"Build tools":
  "CMake":
    language_server:
      "neocmakelsp": true  # mason
    formatter:
      "gersemi": true  # mason
    syntax_highlighting:
      "cmake": true  # tree-sitter, not installed
  "Dockerfile":
    language_server:
      "dockerfile-language-server": true  # mason
    formatter:
      "dockerfmt": true  # mason
    syntax_highlighting:
      "dockerfile": true  # tree-sitter, not installed
  "Gradle":
    language_server:
      "gradle-language-server": false  # mason
    formatter:
      {}
    syntax_highlighting:
      "groovy": true  # tree-sitter, not installed
  "Makefile":
